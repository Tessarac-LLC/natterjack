---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: egresspools.natterjack.io
spec:
  group: natterjack.io
  names:
    categories:
    - natterjack
    kind: EgressPool
    listKind: EgressPoolList
    plural: egresspools
    shortNames:
    - ep
    singular: egresspool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.publicIPs
      name: Public IPs
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EgressPool is a set of egress slots and the gateways that use
          them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EgressPoolSpec defines a set of egress slots and how gateways
              are run for them.
            properties:
              discovery:
                description: Discovery selects the cloud slots that belong to this
                  pool.
                properties:
                  extraTags:
                    additionalProperties:
                      type: string
                    description: ExtraTags must all be present, with these values,
                      on a slot.
                    maxProperties: 16
                    type: object
                type: object
              drainSeconds:
                default: 60
                description: |-
                  DrainSeconds is how long established flows keep using a gateway that is
                  being removed in a planned disruption before its slot moves.
                format: int32
                maximum: 3600
                minimum: 0
                type: integer
              gatewayNodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  GatewayNodeSelector restricts which nodes may run a gateway. Empty means
                  any Linux node that tolerates nothing extra.
                type: object
              gatewayTolerations:
                description: |-
                  GatewayTolerations lets gateways run on tainted nodes. The agent
                  DaemonSet needs the same tolerations, set in the Helm values.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              maxGatewaysPerZone:
                description: |-
                  MaxGatewaysPerZone caps the gateways per zone. Healthy slots beyond the
                  cap stay unattached as spares. Unset means one gateway per healthy slot.
                format: int32
                type: integer
              probe:
                description: Probe sets how fast source nodes detect a failed gateway.
                properties:
                  failureThreshold:
                    default: 3
                    description: |-
                      FailureThreshold is the number of consecutive missed probes after which
                      a gateway is treated as down.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  intervalMilliseconds:
                    default: 100
                    description: IntervalMilliseconds between probes to each gateway.
                    format: int32
                    maximum: 10000
                    minimum: 20
                    type: integer
                type: object
              safetyChecks:
                default: Enforce
                description: |-
                  SafetyChecks selects whether a slot that fails a safety check is
                  quarantined (Enforce) or used with a warning (Warn).
                enum:
                - Enforce
                - Warn
                type: string
              tunnel:
                default: Geneve
                description: Tunnel selects the encapsulation from source nodes to
                  gateways.
                enum:
                - Geneve
                - WireGuard
                type: string
            type: object
            x-kubernetes-validations:
            - message: maxGatewaysPerZone must be at least 1
              rule: '!has(self.maxGatewaysPerZone) || self.maxGatewaysPerZone >= 1'
          status:
            description: EgressPoolStatus is the observed state of an EgressPool.
            properties:
              conditions:
                description: |-
                  Conditions: Ready, Degraded, CrossZoneEgress, SlotsQuarantined,
                  SlotsUnschedulable, ForeignSlots, CloudAccess.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              publicIPs:
                description: |-
                  PublicIPs are the addresses traffic from this pool can leave from, for
                  partner allowlists. It includes spares and quarantined slots that have
                  an address, because they can become active.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              slots:
                description: Slots lists every discovered slot.
                items:
                  description: SlotStatus reports one slot.
                  properties:
                    id:
                      description: ID is the cloud identifier of the slot (on AWS,
                        the ENI ID).
                      type: string
                    node:
                      description: Node the slot is attached or assigned to.
                      type: string
                    publicIP:
                      description: PublicIP is the public IPv4 address traffic leaves
                        from.
                      type: string
                    reason:
                      description: Reason explains the state when it is not Active,
                        in plain language.
                      type: string
                    state:
                      description: State of the slot.
                      enum:
                      - Pending
                      - Attaching
                      - Active
                      - Draining
                      - Spare
                      - Quarantined
                      - Unschedulable
                      - Foreign
                      type: string
                    zone:
                      description: Zone is the availability zone of the slot.
                      type: string
                  required:
                  - id
                  - state
                  - zone
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              zones:
                description: Zones summarizes each zone.
                items:
                  description: ZoneStatus summarizes one zone.
                  properties:
                    readyGateways:
                      description: ReadyGateways serving traffic in the zone.
                      format: int32
                      type: integer
                    slots:
                      description: Slots discovered in the zone.
                      format: int32
                      type: integer
                    zone:
                      description: Zone name.
                      type: string
                  required:
                  - readyGateways
                  - slots
                  - zone
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - zone
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
