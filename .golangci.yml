version: "2"
run:
  timeout: 10m
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - sigs.k8s.io/controller-runtime/*
        - k8s.io/*
    misspell:
      locale: US
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [wrapcheck, gosec]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Tessarac-LLC/natterjack]
