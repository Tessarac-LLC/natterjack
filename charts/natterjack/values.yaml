# Natterjack Helm values. Every value is described in the values reference at
# https://natterjack.io/docs/reference/helm-values/ and validated by
# values.schema.json.

# -- Name of this cluster. The controller only uses egress slots tagged
# `natterjack.io/cluster=<clusterName>`. Required.
clusterName: ""

namespace:
  # -- Create the release namespace with the Pod Security "privileged" label
  # the agent needs. When false, the chart checks that the existing namespace
  # carries the label and fails with a clear message if it does not.
  create: false

crds:
  # -- Install and upgrade the CustomResourceDefinitions with the chart.
  install: true
  # -- Keep the CRDs, and every pool and policy, when the release is
  # uninstalled.
  keep: true

images:
  # -- Pull policy for every image.
  pullPolicy: IfNotPresent
  # -- Image pull secrets, by name, for every component.
  pullSecrets: []

controller:
  # -- Install the controller. Only one controller runs per cluster.
  enabled: true
  image:
    # -- Controller image repository.
    repository: ghcr.io/tessarac-llc/natterjack-controller
    # -- Defaults to the chart's appVersion.
    tag: ""
    # -- Pin by digest; takes precedence over the tag.
    digest: ""
  # -- Two replicas with leader election keep a controller ready to act when
  # one is evicted.
  replicas: 2
  # -- How often the controller re-reads the cloud when nothing changes.
  resync: 30s
  aws:
    # -- AWS region of the cluster's VPC. Required when the controller is
    # enabled.
    region: ""
  serviceAccount:
    # -- ServiceAccount name. Defaults to `<release>-controller`.
    name: ""
    # -- Annotations, for example eks.amazonaws.com/role-arn for IRSA. EKS
    # Pod Identity needs none.
    annotations: {}
  # -- Log level: debug, info or error.
  logLevel: info
  # -- Controller container resources. Memory grows with the number of
  # nodes and pods the controller watches.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # -- Controller pods run on Linux nodes. Add your own constraints here.
  nodeSelector:
    kubernetes.io/os: linux
  # -- Tolerations for controller pods.
  tolerations: []
  # -- Affinity for controller pods.
  affinity: {}
  # -- Defaults spread replicas over zones and nodes.
  topologySpreadConstraints: []
  # -- The controller keeps egress working, so it is scheduled ahead of
  # ordinary workloads.
  priorityClassName: system-cluster-critical
  # -- Extra annotations on controller pods.
  podAnnotations: {}
  # -- Extra labels on controller pods.
  podLabels: {}
  ports:
    # -- Port for the controller's metrics, which require an authorized
    # Kubernetes identity.
    metrics: 8443
    # -- Port for the controller's liveness and readiness probes.
    health: 8081
  podDisruptionBudget:
    # -- Limit voluntary disruptions when more than one replica runs.
    enabled: true
    # -- Controller pods a voluntary disruption may take down at once.
    maxUnavailable: 1

agent:
  # -- Install the agent DaemonSet.
  enabled: true
  image:
    # -- Agent image repository.
    repository: ghcr.io/tessarac-llc/natterjack-agent
    # -- Defaults to the chart's appVersion.
    tag: ""
    # -- Pin by digest; takes precedence over the tag.
    digest: ""
  # -- How pod traffic is steered. `nftables` steers in the host's netfilter
  # hooks. `ebpf` also puts tcx programs first on the node's uplinks, for
  # CNIs that move pod traffic past netfilter (Cilium with eBPF host
  # routing, Calico's eBPF data plane); it needs Linux 6.6 or later. `auto`
  # picks `ebpf` on nodes running such a CNI.
  steering: auto
  # -- Destinations never steered, in addition to private, shared,
  # link-local and reserved ranges. Add any public ranges your VPC uses.
  excludedCIDRs: []
  # -- Packet mark bits the agent owns: one contiguous run of at least four
  # bits that no other component on the node uses. The default suits the AWS
  # VPC CNI (0x80), kube-proxy (0x4000, 0x8000), kindnet, Cilium and Istio.
  # Calico keeps its marks in 0xffff0000: use "0x00003f00" with it. An agent
  # that finds another component's nftables or policy routing rules using
  # its bits reports its node's data path not ready and names the rule.
  markMask: "0x00ff0000"
  # -- First policy routing table the agent owns.
  routeTableBase: 7700
  # -- Priority of the agent's policy routing rules; they use this and the
  # next two. They must sort ahead of any rule that routes pod traffic by its
  # mark or source, such as the AWS VPC CNI's (1024 and 1536). An agent that
  # finds such a rule ahead of its own reports its node's data path not
  # ready and names the rule.
  rulePriority: 1000
  # -- GENEVE UDP port between nodes. Node security groups must allow it
  # between nodes.
  tunnelPort: 6081
  # -- WireGuard UDP port between nodes, for pools with `tunnel: WireGuard`.
  # Must differ from tunnelPort. Node security groups must allow it between
  # nodes.
  wireguardPort: 51871
  # -- UDP port gateways answer probes on, inside their namespace.
  probePort: 6086
  # -- Link-local /30 between the host and gateway namespaces.
  gatewayLink: 169.254.73.0/30
  # -- TCP MSS ceiling for flows leaving a slot.
  mss: 1460
  # -- Host directory for the gateway namespace mount and the mark table. It
  # must be on a filesystem a reboot empties (a tmpfs under /run).
  stateDir: /run/natterjack
  selfTest:
    # -- URL that answers with the caller's public IPv4 address.
    url: https://checkip.amazonaws.com
    # -- How often a gateway tests its slot.
    interval: 30s
  # -- How often the data path is re-applied when nothing changes.
  resync: 30s
  # -- Log level: debug, info or error.
  logLevel: info
  # -- Agent container resources. A gateway node's forwarding happens in the
  # kernel and is not counted here.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # -- The agent runs on every Linux node. Narrow this only if some nodes
  # never send traffic through Natterjack and never serve as gateways.
  nodeSelector:
    kubernetes.io/os: linux
  # -- The agent tolerates every taint by default so it runs on every node.
  tolerations:
    - operator: Exists
  # -- Affinity for agent pods.
  affinity: {}
  # -- A node without its agent sends no traffic through Natterjack, so the
  # agent is scheduled ahead of ordinary workloads.
  priorityClassName: system-node-critical
  # -- Extra annotations on agent pods.
  podAnnotations: {}
  # -- Extra labels on agent pods.
  podLabels: {}
  ports:
    # -- Host port for the agent's metrics, which require an authorized
    # Kubernetes identity.
    metrics: 9751
    # -- Host port for the agent's liveness and readiness probes.
    health: 9752
  updateStrategy:
    # -- Agents restarted at once during an upgrade. A restart does not move
    # the node's gateway role: the slot, its traffic and the probe responder
    # stay in the kernel while the new agent starts. A restart that takes
    # longer than a minute does move it.
    maxUnavailable: 1
  serviceAccount:
    # -- ServiceAccount name. Defaults to `<release>-agent`.
    name: ""

doctor:
  # -- Install the `helm test` that runs `natterjack doctor` in the cluster
  # and fails unless the installation is ready to carry traffic. The test
  # adds read-only RBAC only while it runs.
  enabled: true
  image:
    # -- Image of the `natterjack` command-line tool.
    repository: ghcr.io/tessarac-llc/natterjack
    # -- Defaults to the chart's appVersion.
    tag: ""
    # -- Pin by digest; takes precedence over the tag.
    digest: ""
  # -- Time the checks may take.
  timeout: 60s
  # -- Doctor container resources.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
