name: release

# A release is a signed tag vMAJOR.MINOR.PATCH[-PRERELEASE] on a commit of
# main. It publishes multi-arch images and the chart to GHCR, signs each
# with cosign (keyless, this workflow's identity), attaches SBOMs and SLSA
# build provenance, and creates the GitHub release with the CLI archives,
# which carry provenance too.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io/tessarac-llc

jobs:
  verify:
    name: release / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a release version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests and chart checks
        run: make test chart-lint

  # The whole suite on a real EKS cluster: nothing is published unless it
  # passes on this commit.
  eks-e2e:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/eks-e2e.yml

  publish:
    name: release / publish
    needs: [verify, eks-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write # push images and the chart to ghcr.io
      id-token: write # keyless signing and provenance
      attestations: write # record build provenance attestations
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Tools
        run: make chart-tools && echo "$PWD/bin/chart-tools" >>"$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push images and chart
        id: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          OUT=dist ./hack/release.sh
          for k in controller agent cli chart; do
            echo "$k=$(jq -r ".$k" dist/release.json | sed 's/.*@//')" >>"$GITHUB_OUTPUT"
          done
          jq . dist/release.json >>"$GITHUB_STEP_SUMMARY"
      - name: Sign images and chart
        run: |
          for k in controller agent cli chart; do
            cosign sign --yes "$(jq -r ".$k" dist/release.json)"
          done
      - name: Controller provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/natterjack-controller
          subject-digest: ${{ steps.release.outputs.controller }}
          push-to-registry: true
      - name: Agent provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/natterjack-agent
          subject-digest: ${{ steps.release.outputs.agent }}
          push-to-registry: true
      - name: CLI image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/natterjack
          subject-digest: ${{ steps.release.outputs.cli }}
          push-to-registry: true
      - name: CLI archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/natterjack_*
      - name: Chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/natterjack
          subject-digest: ${{ steps.release.outputs.chart }}
          push-to-registry: true
      - name: Artifact Hub metadata
        if: hashFiles('charts/natterjack/artifacthub-repo.yml') != ''
        run: |
          oras push "$REGISTRY/charts/natterjack:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/natterjack/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  github-release:
    name: release / github
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          controller="$(jq -r .controller dist/release.json)"
          agent="$(jq -r .agent dist/release.json)"
          cli="$(jq -r .cli dist/release.json)"
          chart_version="$(jq -r .chartVersion dist/release.json)"
          identity="https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG"
          cat >notes.md <<NOTES
          ## Install

          \`\`\`sh
          helm install natterjack oci://ghcr.io/tessarac-llc/charts/natterjack --version $chart_version \\
            --namespace natterjack --create-namespace \\
            --set clusterName=<cluster> --set controller.aws.region=<region>
          \`\`\`

          ## Images

          - \`$controller\`
          - \`$agent\`
          - \`$cli\` (\`natterjack doctor\`, run by \`helm test\`)

          ## Check the installation

          \`\`\`sh
          helm test natterjack --namespace natterjack --logs
          \`\`\`

          or download the \`natterjack\` CLI below and run \`natterjack doctor\`.

          ## Verify

          \`\`\`sh
          cosign verify $controller \\
            --certificate-identity $identity \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://$controller --repo $REPO
          gh attestation verify natterjack_${TAG}_linux_amd64.tar.gz --repo $REPO
          \`\`\`
          NOTES
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          (cd dist && sha256sum ./*.tgz ./natterjack_* release.json >SHA256SUMS)
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes-file notes.md --generate-notes "${prerelease[@]}" \
            dist/*.tgz dist/natterjack_* dist/release.json dist/SHA256SUMS
