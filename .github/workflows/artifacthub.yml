name: artifacthub

# Lists the chart on Artifact Hub with hack/artifacthub.sh: the
# organization, the repository for the chart's OCI location and the
# repository metadata that marks it a verified publisher. Every step is
# idempotent. The release workflow calls it after each release; it can also
# be run by hand from main.
#
# The Artifact Hub API key lives in the artifacthub environment, whose
# deployment policy admits main and release tags alone: pull requests never
# see it.

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: artifacthub
  cancel-in-progress: false

jobs:
  publish:
    name: artifacthub / publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: artifacthub
    permissions:
      contents: read
      packages: write # push the repository metadata to the chart's repository
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: List the chart
        env:
          ARTIFACTHUB_API_KEY_ID: ${{ secrets.ARTIFACTHUB_API_KEY_ID }}
          ARTIFACTHUB_API_KEY_SECRET: ${{ secrets.ARTIFACTHUB_API_KEY_SECRET }}
        run: ./hack/artifacthub.sh
