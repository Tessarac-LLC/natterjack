baseURL = "https://natterjack.io/"
title = "Natterjack"
locale = "en-us"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy"]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.160.1"
  [[module.imports]]
    path = "github.com/docsy/docsy/theme"
    disable = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "tango"
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[params]
  description = "Highly available, zone-aware egress gateways for Kubernetes that replace cloud NAT gateways."
  copyright = "Tessarac, LLC"
  github_repo = "https://github.com/Tessarac-LLC/natterjack"
  github_branch = "main"
  github_subdir = "site"
  edit_page = true
  offlineSearch = true
  prism_syntax_highlighting = false
  [params.ui]
    navbar_logo = true
    navbar_translucent_over_cover_disable = false
    sidebar_menu_compact = true
    sidebar_search_disable = false
    breadcrumb_disable = false
    showLightDarkModeMenu = true
    [params.ui.feedback]
      enable = false
  [params.links]
    [[params.links.developer]]
      name = "GitHub"
      url = "https://github.com/Tessarac-LLC/natterjack"
      icon = "fab fa-github"
      desc = "Source, issues and pull requests"
    [[params.links.user]]
      name = "Discussions"
      url = "https://github.com/Tessarac-LLC/natterjack/discussions"
      icon = "fa fa-comments"
      desc = "Questions and ideas"

[menu]
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/Tessarac-LLC/natterjack"
    weight = 50
    pre = "<i class='fab fa-github'></i>"
