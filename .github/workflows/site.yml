name: site

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  HUGO_VERSION: 0.170.0
  HUGO_SHA256: 0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0

jobs:
  build:
    name: site / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # enableGitInfo: last-modified dates come from history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: site/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Hugo (extended), checksum-verified
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Install site dependencies (lockfile, no install scripts)
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          set -euo pipefail
          export PATH="${PWD}/node_modules/.bin:${PATH}"
          hugo --gc --minify --panicOnWarning --printPathWarnings
      - name: Check internal links
        working-directory: site
        run: |
          set -euo pipefail
          # Every href/src that points inside the site must resolve to a built file.
          python3 - <<'EOF'
          import html.parser, os, sys, urllib.parse
          root = "public"
          bad = []
          class P(html.parser.HTMLParser):
              def __init__(self, page):
                  super().__init__(); self.page = page
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k not in ("href", "src") or not v:
                          continue
                      u = urllib.parse.urlparse(v)
                      if u.scheme or u.netloc:
                          if u.netloc != "natterjack.io":
                              continue
                      path = urllib.parse.unquote(u.path)
                      if not path or path.startswith("#"):
                          continue
                      if not path.startswith("/"):
                          path = os.path.join(os.path.dirname(self.page[len(root):]), path)
                      f = os.path.normpath(root + path)
                      if os.path.isdir(f):
                          f = os.path.join(f, "index.html")
                      if not os.path.exists(f):
                          bad.append(f"{self.page}: {v}")
          for d, _, files in os.walk(root):
              for n in files:
                  if n.endswith(".html"):
                      p = os.path.join(d, n)
                      P(p).feed(open(p, encoding="utf-8").read())
          for b in bad:
              print(f"::error::broken internal link {b}")
          sys.exit(1 if bad else 0)
          EOF
      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: site / deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # create the Pages deployment
      id-token: write # deploy-pages proves the request came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
