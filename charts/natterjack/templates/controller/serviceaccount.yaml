{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "natterjack.controller.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "natterjack.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
