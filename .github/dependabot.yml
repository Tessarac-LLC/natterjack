version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directories: ["/site"]
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      aws:
        patterns: ["github.com/aws/*"]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    commit-message:
      prefix: chore
